
name: 📦 Publish Release
run-name: 📦 Publish Release ${{ inputs.ref || github.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The release tag to build and publish
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  RUSTFLAGS: -D warnings
  # Workspaces own their binary packaging; keep the existing four Linux assets.
  RELEASE_REF: ${{ inputs.ref }}

jobs:
  build:
    name: 🏗️ Build (${{ matrix.build.asset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build:
          - { target: x86_64-unknown-linux-gnu, asset: linux-amd64 }
          - { target: aarch64-unknown-linux-gnu, asset: linux-arm64 }
          - { target: x86_64-unknown-linux-musl, asset: linux-amd64-musl }
          - { target: aarch64-unknown-linux-musl, asset: linux-arm64-musl }
    steps:
      - uses: actions/checkout@v7
        with:
          # Build the release revision, never a moving branch tip.
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.build.target }}
      - uses: Swatinem/rust-cache@v2

      # cross supplies both the target linker and the vendored C build toolchain.
      - uses: taiki-e/install-action@cross

      - name: Build
        run: cross build --release --locked --target ${{ matrix.build.target }}

      - name: Stage the asset
        run: |
          # Accept both bare tags and full tag refs without introducing path separators.
          tag="${RELEASE_REF#refs/tags/}"
          mkdir -p dist
          cp "target/${{ matrix.build.target }}/release/secrets" \
             "dist/secrets_${tag}_${{ matrix.build.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: asset-${{ matrix.build.asset }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: 🚀 Publish
    needs: build
    runs-on: ubuntu-latest
    # Only uploads serialize; builds remain parallel and no partial upload is cancelled.
    concurrency:
      group: publish-release
      cancel-in-progress: false
    # App credentials remain scoped to the project's release environment.
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # The upload authenticates with the short-lived App token instead.
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: asset-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        # Protect filenames beginning with a dash from option parsing.
        run: sha256sum -- * > SHA256SUMS

      # gh-ship creates the draft first and publishes it only after this succeeds.
      - name: Upload assets to the draft release
        run: |
          tag="${RELEASE_REF#refs/tags/}"
          gh release upload "$tag" dist/* --clobber
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
