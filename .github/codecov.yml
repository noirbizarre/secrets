# --- project-specific: Linux only -------------------------------------------
#
# rust.tpl's own template runs a three-OS matrix and waits for all three
# reports (`after_n_builds: 3`) before notifying. This project's `test` job
# is Linux-only (see the matching comment in .github/workflows/ci.yaml), so
# only one report is ever uploaded — left at 3, Codecov would wait forever
# for two reports that will never arrive and never post a status.
codecov:
  notify:
    after_n_builds: 1

# One leg runs on every commit, so a missing report means a broken run, not
# an untested platform — nothing should be carried forward to hide it.
flags:
  linux:
    carryforward: false

coverage:
  range: "80...100"
  status:
    project:
      default:
        # Target coverage percentage
        target: auto
        # Maximum allowed coverage drop (0.5%)
        threshold: 0.5%
    patch:
      default:
        # Require 80% coverage on new code
        target: 80%
        # No threshold for patch (strict)
        threshold: 0%

# Require any change in coverage to post
comment:
  require_changes: true
  # Held back for the same reason as the status above.
  after_n_builds: 3
