[files]
extend-exclude = [
  # Short SHAs in the changelog and the lockfiles read as typos.
  "Cargo.lock",
  "mise.lock",
  "CHANGELOG.md",
  # Snapshots record output verbatim, including any deliberate typo under test.
  "tests/snapshots/**",
  # Documentation build output.
  "site/**",
  # Pre-existing branding asset, not project prose — typos flags its own
  # filename.
  "logo.inpiration.png",
  # An ascii-armored OpenPGP secret key (base64) — a test fixture, not
  # prose; its content is never natural-language text for typos to check.
  "crates/secretsd/src/backend/pass/testdata/gopass-fixture/key.asc",
]

[default.extend-words]
# Deliberate misspellings that a test asserts on — typically the input to a
# "did you mean ...?" diagnostic. Correcting one here deletes the test that
# proves the suggestion works.

# Not our typo: this is 1Password Desktop's own literal, load-bearing abstract
# socket name (embedded verbatim in libop_sdk_ipc_client.so's .rodata), quoted
# exactly in docs/architecture/1password-integration.md. "Correcting" it here
# would make the documentation say something that does not match the binary.
intergations = "intergations"
