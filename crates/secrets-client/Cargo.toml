# secrets-client — the public Rust client library for the Secrets D-Bus
# protocol.
#
# Applications that want to read from `secretsd` without learning `zbus`,
# D-Bus object paths, interface names, error mapping, or connection setup
# depend on this crate instead of talking to `secrets_core::dbus` (or
# `zbus`) directly. It has no dependency on `secretsd`: it is a client of
# the protocol, not an abstraction over the daemon's implementation.

[package]
name = "secrets-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The public Rust client library for the Secrets D-Bus protocol"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lib]
name = "secrets_client"
path = "src/lib.rs"

[dependencies]
secrets-core = { version = "0.1.0", path = "../secrets-core" }
zbus = "5.19.0"

[dev-dependencies]
pretty_assertions = "1.4.1"
rstest = "0.27.0"
